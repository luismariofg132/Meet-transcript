name: Windows Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[audio,transcription,cuda,gui,youtube]"
          python -m pip install "nuitka>=4.1.1" zstandard

      - name: Build standalone Windows application
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/build.ps1 -ProduceZip

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassScribe-win64-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
